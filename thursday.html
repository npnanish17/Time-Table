<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Monday Timetable</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      padding: 30px 15px;
    }

    /* =========================
       BACK BUTTON
    ========================= */
    .back-btn {
      display: inline-block;
      padding: 12px 22px;
      margin-bottom: 25px;

      background: linear-gradient(135deg, #2c3e50, #3498db);
      color: white;

      text-decoration: none;
      font-weight: 600;

      border-radius: 10px;
      transition: 0.3s;
    }

    .back-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    /* =========================
       TITLE
    ========================= */
    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #1f2937;
    }

    /* =========================
       MAIN TABLE
    ========================= */
    .timetable {
      width: 75%;
      max-width: 1000px;
      margin: auto;

      border-collapse: separate;
      border-spacing: 0 12px;
    }

    .timetable td {
      border: 1px solid #dfe3e8;
    }

    /* =========================
       LEFT TIME COLUMN
    ========================= */
    .time {
      width: 20%;

      background: #2c3e50;
      color: white;

      text-align: center;
      font-weight: 700;
      font-size: 1rem;

      padding: 30px 15px;

      border-radius: 10px 0 0 10px;
    }

    /* =========================
       RIGHT SUBJECT BOX
    ========================= */
    .subject-box {
      width: 80%;
      height: 156px;

      padding: 0;
      position: relative;

      display: flex;
      align-items: stretch;

      background: linear-gradient(
        to bottom,
        #d9d9d9,
        #999999,
        #333333
      );

      border-radius: 0 10px 10px 0;

      overflow: hidden;
    }

    /* =========================
       SUBJECT NAME AREA
    ========================= */
    .subject-name {
      flex: 1;

      display: flex;
      align-items: flex-end;

      padding: 0 25px 20px;

      color: white;

      font-size: 1.3rem;
      font-weight: 700;

      text-shadow: 0 2px 5px rgba(0,0,0,0.8);

      z-index: 2;
    }

    /* =========================
       TEACHER PHOTO BOX
    ========================= */
    .teacher-photo {
      width: 130px;
      height: 100%;

      flex-shrink: 0;

      overflow: hidden;

      background: rgba(255,255,255,0.15);
    }

    .teacher-photo img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;
    }

    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 600px) {

      .timetable {
        width: 100%;
      }

      .time {
        width: 30%;
        font-size: 0.85rem;
        padding: 20px 8px;
      }

      .subject-box {
        width: 70%;
        height: 150px;
      }

      .subject-name {
        font-size: 1rem;
        padding: 0 12px 15px;
      }

      .teacher-photo {
        width: 100px;
      }
    }
    /* =========================
   NEXT DAY BUTTON
========================= */
.next-day {
  display: block;
  width: fit-content;

  margin: 30px auto 10px;

  padding: 14px 28px;

  background: linear-gradient(135deg, #3498db, #2c3e50);
  color: white;

  text-decoration: none;
  font-weight: 700;
  font-size: 1rem;

  border-radius: 10px;

  transition: 0.3s;
}

.next-day:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}
  </style>
</head>

<body>
